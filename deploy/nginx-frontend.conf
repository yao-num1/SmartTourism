# /etc/nginx/sites-available/smarttourism-frontend
# SmartTourism 前端独立域名配置（www.lingxiwenlv.icu + lingxiwenlv.icu）
# 首次部署先使用 HTTP，待 certbot 申请证书后会自动改写为 HTTPS。

server {
    listen 80;
    server_name www.lingxiwenlv.icu lingxiwenlv.icu;

    # === 前端静态文件根目录 ===
    root /opt/smarttourism/dashboard;
    index index.html;

    # === API 反向代理到 Gunicorn ===
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（AI 对话流式输出需要）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # === map / mobile 页面（Flask 路由） ===
    location /map {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /m {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === 静态资源缓存 ===
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # === SPA 前端回退（所有未匹配的路由返回 index.html） ===
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === 安全头 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
