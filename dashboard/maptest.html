<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>地图测试</title>
<style>#map{width:100%;height:100vh}</style>
</head>
<body>
<div id="map"></div>
<script>
// 诊断页：高德 Key 从后端 /api/map/key 读取（不内置于前端）
function loadMapWithKey(jsKey) {
  var s = document.createElement('script');
  s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + (jsKey || '');
  s.onload = function() {
      var map = new AMap.Map('map', { zoom: 15, center: [120.658, 28.012] });
      new AMap.Marker({ position: [120.658, 28.012], map: map });
      document.body.insertAdjacentHTML('beforeend', '<div style=\"position:fixed;top:10px;left:10px;background:green;color:white;padding:8px;border-radius:6px;\">✅ 地图加载成功 - 温州</div>');
  };
  s.onerror = function() {
      document.body.innerHTML = '<h1>❌ 高德 JS Key 加载失败</h1><p>请在后台 data/plugin_config.json 配置 amap_js_key 后重试</p>';
  };
  document.head.appendChild(s);
}
fetch('/api/map/key').then(function(r){return r.json();}).then(function(d){ loadMapWithKey(d.key); }).catch(function(){ loadMapWithKey(''); });
</script>
</body>
</html>
